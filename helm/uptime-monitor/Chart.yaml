# Chart.yaml — identity card for the chart. Helm reads this to know
# what this package is, its version, and the app version it deploys.
apiVersion: v2          # v2 = Helm 3 chart format
name: uptime-monitor    # chart name; used as default release prefix
description: A Django-based uptime monitor (web, celery worker, beat, postgres, redis)
type: application       # "application" (deployable) vs "library" (shared helpers)

# version  = the version of THIS CHART (bump when you change templates/values)
# appVersion = the version of the APP you're shipping (your Docker image)
version: 0.2.0
appVersion: "1.0.0"
