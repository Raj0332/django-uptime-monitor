# Secret — like the ConfigMap but for sensitive values.
# We store PLAINTEXT in values.yaml and let Helm's b64enc encode it here,
# which is what a k8s Secret's "data:" field expects (base64). This is why
# you didn't have to run `echo -n ... | base64` by hand like in raw k8s.
apiVersion: v1
kind: Secret
metadata:
  name: uptime-secret
  labels:
    {{- include "uptime-monitor.labels" . | nindent 4 }}
type: Opaque
data:
  SECRET_KEY: {{ .Values.secrets.secretKey | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  # DATABASE_URL is assembled here (not in the ConfigMap) because it embeds
  # the postgres password. Host "postgres:5432" matches the Service name.
  DATABASE_URL: {{ printf "postgres://%s:%s@postgres:5432/%s" .Values.postgres.user .Values.secrets.postgresPassword .Values.postgres.database | b64enc | quote }}
