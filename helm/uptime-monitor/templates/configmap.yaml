# ConfigMap — non-secret env vars injected into web/celery/beat via envFrom.
apiVersion: v1
kind: ConfigMap
metadata:
  name: uptime-config
  labels:
    {{- include "uptime-monitor.labels" . | nindent 4 }}
data:
  DJANGO_SETTINGS_MODULE: {{ .Values.config.djangoSettingsModule | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  ALLOWED_HOSTS: {{ .Values.config.allowedHosts | quote }}
  # DATABASE_URL lives in the Secret, not here — it embeds the DB password,
  # and ConfigMaps are not a place for credentials.
