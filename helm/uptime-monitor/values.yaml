# values.yaml — the single place you configure the whole app.
# Templates read these with {{ .Values.<path> }}. Override at install time
# with --set key=value or -f my-values.yaml. This is the heart of Helm:
# config lives here, not scattered across 9 manifests.

# ---- Application image (used by web, celery, beat — they share one image) ----
image:
  repository: rajkm332/uptime-monitor
  tag: "0.2.0"
  pullPolicy: IfNotPresent   # IfNotPresent = don't re-pull if already on the node

# ---- Non-secret config -> rendered into a ConfigMap ----
# NOTE: redisUrl references the service name "redis"; that name is kept fixed
# in the templates so the URL keeps working. DATABASE_URL is NOT here — it
# contains the DB password, so the secret template assembles it from
# postgres.user/postgres.database + secrets.postgresPassword.
config:
  djangoSettingsModule: uptime.settings
  redisUrl: redis://redis:6379/0
  # Comma-separated. When ingress.enabled, ingress.host is auto-appended (see configmap.yaml).
  allowedHosts: "localhost,127.0.0.1,web,.svc,.cluster.local"
  # Only used when ingress is DISABLED; with ingress on, origins are derived from the host.
  csrfTrustedOrigins: ""
  # "false" => web pods skip migrations (the migrate Job/hook owns them) so web can scale > 1.
  runMigrationsOnStart: "false"

# ---- Secret values (PLAINTEXT here; Helm base64-encodes them for you) ----
# This is a teaching convenience. In real production you'd use sealed-secrets,
# External Secrets, or SOPS — you would NOT commit plaintext secrets to git.
secrets:
  secretKey: dev-secret-key-change-in-prod
  postgresPassword: uptime

# ---- Postgres (in-cluster, for learning; prod would use managed DB) ----
postgres:
  image: postgres:16-alpine
  user: uptime
  database: uptime
  storage: 1Gi
  resources: {}            # left empty; postgres had no limits in your k8s manifest

# ---- Redis ----
redis:
  image: redis:7-alpine

# ---- Ingress (disabled by default). Enable for hostname routing instead of
# NodePort. On minikube: `minikube addons enable ingress`, then map ingress.host
# to `minikube ip` in your hosts file. ----
ingress:
  enabled: false
  className: nginx
  host: uptime.local
  annotations: {}
  # TLS blocks, e.g.:
  #   - secretName: uptime-tls
  #     hosts: [uptime.local]
  tls: []

# ---- Django web server ----
web:
  replicas: 1
  service:
    type: NodePort        # NodePort so `minikube service` can reach it
    port: 8000
  # CPU-based autoscaling. When enabled, the Deployment's replicas field is
  # omitted so the HPA owns the replica count (see web-deployment.yaml).
  # Requires metrics-server: `minikube addons enable metrics-server`.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ---- Celery worker ----
celery:
  replicas: 1
  command: ["/entrypoint.sh", "worker"]
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ---- Celery beat (scheduler) ----
beat:
  replicas: 1
  command: ["/entrypoint.sh", "beat"]
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
