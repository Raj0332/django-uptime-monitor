apiVersion: v1
kind: ConfigMap
metadata:
  name: uptime-config
  namespace: uptime
data:
  ALLOWED_HOSTS: localhost,127.0.0.1,web,.svc,.cluster.local
  DJANGO_SETTINGS_MODULE: uptime.settings
  REDIS_URL: redis://redis:6379/0
  # DATABASE_URL moved to secret.yaml — it embeds the DB password, and
  # ConfigMaps are not a place for credentials.

