apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: uptime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: your-dockerhub-username/uptime-monitor:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: uptime-config
            - secretRef:
                name: uptime-secret
          livenessProbe:
            httpGet:
              path: /healthz/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
