<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Uptime Monitor{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="h-full flex flex-col">

  <!-- Navbar -->
  <nav class="bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <!-- Logo -->
        <a href="/sites/" class="flex items-center gap-2 text-blue-600 font-bold text-xl">
          <span class="inline-block w-3 h-3 rounded-full bg-green-500 animate-pulse"></span>
          UptimeMonitor
        </a>
        <!-- Nav links -->
        <div class="flex items-center gap-6">
          {% if user.is_authenticated %}
            <a href="/sites/" class="text-gray-600 hover:text-blue-600 font-medium text-sm">Sites</a>
            <a href="/sites/add/" class="text-gray-600 hover:text-blue-600 font-medium text-sm">+ Add Site</a>
            <!-- Username dropdown -->
            <div class="relative" x-data="{ open: false }">
              <button
                onclick="this.nextElementSibling.classList.toggle('hidden')"
                class="flex items-center gap-2 text-gray-700 text-sm font-medium hover:text-blue-600"
              >
                <span class="w-8 h-8 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-xs uppercase">
                  {{ user.username|first }}
                </span>
                {{ user.username }}
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
              </button>
              <div class="hidden absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg border border-gray-100 z-10">
                <a href="/admin/" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Admin</a>
                <hr class="border-gray-100"/>
                <form method="post" action="/accounts/logout/">
                  {% csrf_token %}
                  <button type="submit" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                    Sign out
                  </button>
                </form>
              </div>
            </div>
          {% else %}
            <a href="/accounts/login/" class="text-gray-600 hover:text-blue-600 text-sm font-medium">Sign in</a>
            <a href="/accounts/signup/" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">Sign up</a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>

  <!-- Flash messages -->
  {% if messages %}
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 space-y-2">
    {% for message in messages %}
    <div class="flex items-center justify-between px-4 py-3 rounded-lg
      {% if message.tags == 'error' %}bg-red-50 border border-red-200 text-red-800
      {% elif message.tags == 'warning' %}bg-yellow-50 border border-yellow-200 text-yellow-800
      {% elif message.tags == 'success' %}bg-green-50 border border-green-200 text-green-800
      {% else %}bg-blue-50 border border-blue-200 text-blue-800{% endif %}
    ">
      <span class="text-sm font-medium">{{ message }}</span>
      <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-gray-600 ml-4 text-lg leading-none">&times;</button>
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <!-- Main content -->
  <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-200 bg-white mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center text-xs text-gray-400">
      <span>UptimeMonitor &mdash; self-hosted</span>
      <a href="/healthz/" class="hover:text-gray-600">healthz</a>
    </div>
  </footer>

</body>
</html>
